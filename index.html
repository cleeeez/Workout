  <script>
    /* =========================================================================
       1. CONSTANTS, GLOBAL UI STATE & UTILITIES

    const STORAGE_KEY = 'iron_macro_pplul_v2';

    // Non-persisted view state

    /**
     * Format a Date object into local YYYY-MM-DD (avoids UTC timezone drift).
     */
    function getLocalDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    /**
     * Shift a YYYY-MM-DD string by deltaDays.
     */
    function shiftDateStr(dateStr, deltaDays) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + deltaDays);
      return getLocalDateStr(dt);
    }

    /**
     * Human-readable date label (e.g., "Today, Nov 23" or "Mon, Nov 18").
     */
    function formatDateLabel(dateStr) {
      if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr || '';
      const todayStr = getLocalDateStr(new Date());
      const yesterdayStr = shiftDateStr(todayStr, -1);
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const shortMonthDay = dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      const weekday = dt.toLocaleDateString('en-US', { weekday: 'short' });
      if (dateStr === todayStr) return `Today, ${shortMonthDay}`;
      if (dateStr === yesterdayStr) return `Yesterday, ${shortMonthDay}`;
      return `${weekday}, ${shortMonthDay}`;
    }

    /**
     * Compact chart date label ("11/23").
     */
    function formatShortChartDate(dateStr) {
      if (!dateStr || !dateStr.includes('-')) return dateStr || '';
      const [, m, d] = dateStr.split('-').map(Number);
      return `${m}/${d}`;
    }

    /**
     * Compact unique ID generator.
     */
    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    /**
     * Escape HTML entities to prevent XSS.
     */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * Unit Conversion Helpers (all weights stored canonically in lbs).
     */
    function getUnit() {
      return appState?.settings?.unit || 'lbs';
    }

    function fromLbs(lbs, decimals = 1) {
      if (lbs === null || lbs === undefined || isNaN(lbs)) return null;
      const val = getUnit() === 'kg' ? lbs / LBS_PER_KG : lbs;
      return Number(val.toFixed(decimals));
    }

    /**
     * Round a display weight nicely to nearest 0.25 (supports 1.25 kg and 2.5 lbs increments).
     */
    function roundNiceWeight(val) {
      if (val === null || val === undefined || isNaN(val)) return null;
      return Math.round(val * 4) / 4;
    }

    function toLbs(displayVal) {
      const num = parseFloat(displayVal);
      if (isNaN(num)) return null;
      return getUnit() === 'kg' ? num * LBS_PER_KG : num;
    }

    function formatWeight(lbs, decimals = 1) {
      const v = fromLbs(lbs, decimals);
      if (v === null) return '--';
      return `${v} ${getUnit()}`;
    }

    /**
     * Epley Formula for Estimated 1RM: weight * (1 + reps / 30)
     */
    function calcEpley1RM(weightLbs, reps) {
      if (!weightLbs || !reps || weightLbs <= 0 || reps <= 0) return 0;
      if (reps === 1) return weightLbs;
      return weightLbs * (1 + reps / 30);
    }

    /**
     * Floating toast notification (never uses alert).
     */
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const styles = {
        success: 'bg-emerald-500/20 border-emerald-400/50 text-emerald-200',
        info: 'bg-cyan-500/20 border-cyan-400/50 text-cyan-200',
        warning: 'bg-amber-500/20 border-amber-400/50 text-amber-200',
        danger: 'bg-rose-500/20 border-rose-400/50 text-rose-200',
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-2.5 rounded-2xl border backdrop-blur-md shadow-xl text-xs font-bold flex items-center gap-2 transition-all duration-300 opacity-0 -translate-y-2 ${styles[type] || styles.info}`;
      el.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      requestAnimationFrame(() => {
        el.classList.remove('opacity-0', '-translate-y-2');
      });
      setTimeout(() => {
        el.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 2700);
    }

    /**
     * Subtle double chime via Web Audio API when rest timer hits 0.
     */
    function playTimerChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        [0, 0.22].forEach((offset) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now + offset);
          gain.gain.setValueAtTime(0.14, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.19);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.2);
        });
      } catch (e) {
        // Ignore Web Audio restrictions
      }
    }

    /**

    /* =========================================================================
       3. PERSISTENT DATA RECALL & AUTOMATIC MULTI-KEY MIGRATION
       ========================================================================= */

    /**
     * Clean legacy "Day X: " prefixes from split names so no fixed days are designated.
     */
    function sanitizeSplitName(name) {
      return String(name || '').replace(/^Day\s+\d+\s*:\s*/i, '').trim();
    }

    /**
     * Merge source state into target state without overwriting existing user logs
     * and avoiding duplicate workouts or meals.
     */
    function mergeStates(target, source) {
      if (!source || typeof source !== 'object') return false;
      let mergedAny = false;

      // Merge weights (preserve target's date if already present, otherwise copy)
      if (source.weights && typeof source.weights === 'object') {
        Object.entries(source.weights).forEach(([dateStr, val]) => {
          if (typeof val === 'number' && !isNaN(val) && target.weights[dateStr] === undefined) {
            target.weights[dateStr] = val;
            if (source.sampleWeightDates?.[dateStr]) {
              target.sampleWeightDates[dateStr] = true;
            }
            mergedAny = true;
          }
        });
      }

      // Merge nutrition entries by date, deduplicating by ID or name+calories+protein+time
      if (source.nutrition && typeof source.nutrition === 'object') {
        Object.entries(source.nutrition).forEach(([dateStr, meals]) => {
          if (!Array.isArray(meals)) return;
          if (!target.nutrition[dateStr]) target.nutrition[dateStr] = [];
          const existingIds = new Set(target.nutrition[dateStr].map(m => m.id));
          const existingSigs = new Set(target.nutrition[dateStr].map(m => `${m.name}|${m.calories}|${m.protein}|${m.time || ''}`));
          meals.forEach(m => {
            if (!m || !m.name) return;
            const sig = `${m.name}|${m.calories}|${m.protein}|${m.time || ''}`;
            if (!existingIds.has(m.id) && !existingSigs.has(sig)) {
              target.nutrition[dateStr].push({ ...m, id: m.id || uid('meal') });
              existingIds.add(m.id);
              existingSigs.add(sig);
              mergedAny = true;
            }
          });
        });
      }

      // Merge workouts, deduplicating by ID or date+name+totalVolume
      if (Array.isArray(source.workouts)) {
        const existingWkIds = new Set(target.workouts.map(w => w.id));
        const existingWkSigs = new Set(target.workouts.map(w => `${w.date}|${sanitizeSplitName(w.name)}|${w.totalVolume}`));
        source.workouts.forEach(w => {
          if (!w || !w.date) return;
          const cleanName = sanitizeSplitName(w.name);
          const sig = `${w.date}|${cleanName}|${w.totalVolume}`;
          if (!existingWkIds.has(w.id) && !existingWkSigs.has(sig)) {
            target.workouts.push({ ...w, name: cleanName, id: w.id || uid('wk') });
            existingWkIds.add(w.id);
            existingWkSigs.add(sig);
            mergedAny = true;
          }
        });
      }

      // Merge quickFoods by name
      if (Array.isArray(source.quickFoods)) {
        const existingQfNames = new Set(target.quickFoods.map(q => q.name.toLowerCase()));
        source.quickFoods.forEach(q => {
          if (q && q.name && !existingQfNames.has(q.name.toLowerCase())) {
            target.quickFoods.push({ ...q, id: q.id || uid('qf') });
            existingQfNames.add(q.name.toLowerCase());
            mergedAny = true;
          }
        });
      }

      // Merge custom templates not already present by ID or sanitized name
      if (Array.isArray(source.templates)) {
        const existingTplIds = new Set(target.templates.map(t => t.id));
        const existingTplNames = new Set(target.templates.map(t => sanitizeSplitName(t.name).toLowerCase()));
        source.templates.forEach(t => {
          if (!t || !t.name) return;
          const cleanName = sanitizeSplitName(t.name);
          if (!existingTplIds.has(t.id) && !existingTplNames.has(cleanName.toLowerCase())) {
            target.templates.push({
              ...t,
              name: cleanName,
              shortLabel: (t.shortLabel || cleanName).slice(0, 6)
            });
            existingTplIds.add(t.id);
            existingTplNames.add(cleanName.toLowerCase());
            mergedAny = true;
          }
        });
      }

      return mergedAny;
    }

    /**
     * Load state from primary key `iron_macro_pplul_v2` AND automatically scan/migrate
     * any existing user-logged data from older or sibling `iron_macro*` keys.
     */
    function loadState() {
      const defaults = createEmptyState();
      let loadedPrimary = null;
      const siblingPayloads = [];

      try {
        // 1. Check primary storage key
        const rawPrimary = localStorage.getItem(STORAGE_KEY);
        if (rawPrimary) {
          const parsed = JSON.parse(rawPrimary);
          if (parsed && typeof parsed === 'object') {
            loadedPrimary = parsed;
          }
        }

        // 2. Scan for sibling/legacy keys (iron_macro_pplul_v3, iron_macro_v1, iron_macro_data, or any iron_macro*)
        const explicitLegacyKeys = ['iron_macro_pplul_v3', 'iron_macro_v1', 'iron_macro_data'];
        const discoveredKeys = new Set(explicitLegacyKeys);
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k !== STORAGE_KEY && k.toLowerCase().startsWith('iron_macro')) {
            discoveredKeys.add(k);
          }
        }

        discoveredKeys.forEach(k => {
          try {
            const raw = localStorage.getItem(k);
            if (!raw) return;
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object' && (parsed.workouts || parsed.weights || parsed.nutrition || parsed.templates)) {
              siblingPayloads.push({ key: k, data: parsed });
            }
          } catch (e) {
            // Skip unreadable sibling keys
          }
        });
      } catch (err) {
        console.error('Error scanning localStorage:', err);
      }

      if (loadedPrimary || siblingPayloads.length > 0) {
        // Start from primary if available, otherwise first discovered legacy payload
        const baseSource = loadedPrimary || siblingPayloads[0].data;
        appState = {
          settings: { ...defaults.settings, ...(baseSource.settings || {}) },
          weights: { ...(baseSource.weights || {}) },
          sampleWeightDates: { ...(baseSource.sampleWeightDates || {}) },
          nutrition: { ...(baseSource.nutrition || {}) },
          quickFoods: Array.isArray(baseSource.quickFoods) && baseSource.quickFoods.length > 0
            ? baseSource.quickFoods
            : getDefaultQuickFoods(),
          templates: Array.isArray(baseSource.templates) && baseSource.templates.length > 0
            ? baseSource.templates.map(t => ({
                ...t,
                name: sanitizeSplitName(t.name),
                shortLabel: (t.shortLabel || sanitizeSplitName(t.name)).slice(0, 6)
              }))
            : getDefaultTemplates(),
          workouts: Array.isArray(baseSource.workouts)
            ? baseSource.workouts.map(w => ({ ...w, name: sanitizeSplitName(w.name) }))
            : [],
          activeWorkout: baseSource.activeWorkout
            ? { ...baseSource.activeWorkout, name: sanitizeSplitName(baseSource.activeWorkout.name) }
            : null
        };

        // Merge any remaining sibling keys so no historical data is left behind
        let migratedCount = 0;
        siblingPayloads.forEach(item => {
          if (!loadedPrimary && item.data === baseSource) {
            migratedCount++;
            return;
          }
          if (mergeStates(appState, item.data)) {
            migratedCount++;
          }
        });

        saveState();
        if (migratedCount > 0 && !loadedPrimary) {
          setTimeout(() => showToast('Previous logs automatically recalled & migrated!', 'info'), 400);
        }
        return;
      }

      // No prior data found anywhere in localStorage -> seed 14-day sample dataset
      appState = createSampleState();
      saveState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        console.error('Error saving to localStorage:', err);
        showToast('Storage full — could not save changes.', 'danger');
      }
    }

    /* =========================================================================
       4. PROGRESSIVE OVERLOAD TARGET ENGINE & ANALYTICS
       ========================================================================= */

    /**
     * Look up exercise config (sets, repMin, repMax, type) from templates by name.
     */
    function findExerciseConfig(exerciseName) {
      for (const tpl of appState.templates) {
        for (const ex of tpl.exercises) {
          if (ex.name === exerciseName) return ex;
        }
      }
      return { name: exerciseName, sets: 3, repMin: 8, repMax: 12, type: 'compound' };
    }

    /**
     * Plate-friendly increment in current display unit.
     */
    function getIncrementForType(exType) {
      const s = appState.settings;
      const isCompound = exType !== 'isolation';
      if (getUnit() === 'kg') {
        const incDisplay = isCompound ? (Number(s.compoundIncrementKg) || 2.5) : (Number(s.isolationIncrementKg) || 1.25);
        return { incDisplay, incLbs: incDisplay * LBS_PER_KG };
      } else {
        const incDisplay = isCompound ? (Number(s.compoundIncrementLbs) || 5) : (Number(s.isolationIncrementLbs) || 2.5);
        return { incDisplay, incLbs: incDisplay };
      }
    }

    /**
     * CORE PROGRESSIVE OVERLOAD ENGINE
     * Evaluates the most recent session's sets against the exercise's rep range & mode:
     * - 'weight_first': Suggests last top weight + increment for target rep range.
     * - 'double_progression': If user hit repMax across working sets (or top set >= repMax),
     *   increase weight by increment and reset to repMin; otherwise keep weight and aim for +1 rep.
     */
    function calculateOverloadTarget(sessionSetsLbs, exConfig) {
      const repMin = Number(exConfig?.repMin) || 8;
      const repMax = Number(exConfig?.repMax) || 12;
      const exType = exConfig?.type || 'compound';
      const mode = appState.settings.progressionMode || 'weight_first';
      const unit = getUnit();

      const validSets = (sessionSetsLbs || []).filter(s => (Number(s.weight) || 0) > 0 && (Number(s.reps) || 0) > 0);
      const topSet = getTopWorkingSet(validSets);

      if (!topSet) {
        return {
          hasHistory: false,
          targetWeightDisplay: null,
          targetWeightLbs: null,
          targetRepsText: `${repMin}–${repMax}`,
          targetRepsFill: repMin,
          badgeDelta: 'Set baseline',
          action: 'baseline'
        };
      }

      const lastWeightDisplay = roundNiceWeight(fromLbs(topSet.weight, 2));
      const lastReps = Number(topSet.reps);
      const allSetsHitMax = validSets.length > 0 && validSets.every(s => Number(s.reps) >= repMax);
      const { incDisplay } = getIncrementForType(exType);

      if (mode === 'double_progression') {
        if (allSetsHitMax || lastReps >= repMax) {
          const nextDisplay = roundNiceWeight(lastWeightDisplay + incDisplay);
          return {
            hasHistory: true,
            targetWeightDisplay: nextDisplay,
            targetWeightLbs: toLbs(nextDisplay),
            targetRepsText: `${repMin}`,
            targetRepsFill: repMin,
            badgeDelta: `+${incDisplay} ${unit} (hit ${repMax} reps!)`,
            action: 'increase_weight'
          };
        } else if (lastReps >= repMin) {
          const nextReps = lastReps + 1;
          return {
            hasHistory: true,
            targetWeightDisplay: lastWeightDisplay,
            targetWeightLbs: toLbs(lastWeightDisplay),
            targetRepsText: `${nextReps}`,
            targetRepsFill: nextReps,
            badgeDelta: `+1 rep @ ${lastWeightDisplay} ${unit}`,
            action: 'increase_reps'
          };
        } else {
          return {
            hasHistory: true,
            targetWeightDisplay: lastWeightDisplay,
            targetWeightLbs: toLbs(lastWeightDisplay),
            targetRepsText: `${repMin}`,
            targetRepsFill: repMin,
            badgeDelta: `Hold weight, hit ${repMin} reps`,
            action: 'hold_weight'
          };
        }
      } else {
        // Weight-First Overload
        if (lastReps >= repMin) {
          const nextDisplay = roundNiceWeight(lastWeightDisplay + incDisplay);
          return {
            hasHistory: true,
            targetWeightDisplay: nextDisplay,
            targetWeightLbs: toLbs(nextDisplay),
            targetRepsText: `${repMin}–${repMax}`,
            targetRepsFill: repMin,
            badgeDelta: `+${incDisplay} ${unit} overload`,
            action: 'increase_weight'
          };
        } else {
          return {
            hasHistory: true,
            targetWeightDisplay: lastWeightDisplay,
            targetWeightLbs: toLbs(lastWeightDisplay),
            targetRepsText: `${repMin}–${repMax}`,
            targetRepsFill: repMin,
            badgeDelta: `Hold weight, hit ${repMin}+ reps`,
            action: 'hold_weight'
          };
        }
      }
    }

    /**
     * Find top working set (heaviest weight, tie-broken by highest reps).
     */
    function getTopWorkingSet(sets) {
      let top = null;
      (sets || []).forEach(s => {
        const w = Number(s.weight) || 0;
        const r = Number(s.reps) || 0;
        if (w <= 0 || r <= 0) return;
        if (!top || w > top.weight || (w === top.weight && r > top.reps)) {
          top = { weight: w, reps: r };
        }
      });
      return top;
    }

    /**
     * Compute complete history & PR stats for an exercise across all completed workouts.
     */
    function getExerciseHistoryStats(exerciseName) {
      const sorted = [...appState.workouts].sort((a, b) => a.date.localeCompare(b.date));
      const history = [];
      let bestE1RM = 0;
      let maxWeight = 0;
      let bestVolume = 0;

      sorted.forEach(wk => {
        const sets = wk.setsByExercise?.[exerciseName];
        if (!sets || sets.length === 0) return;

        let sessionMaxW = 0;
        let sessionBestE1RM = 0;
        let sessionVolume = 0;
        let bestE1RMSet = null;
        const topSet = getTopWorkingSet(sets);

        sets.forEach(s => {
          const w = Number(s.weight) || 0;
          const r = Number(s.reps) || 0;
          if (w <= 0 || r <= 0) return;
          const e1rm = calcEpley1RM(w, r);
          sessionVolume += w * r;
          if (w > sessionMaxW) sessionMaxW = w;
          if (e1rm > sessionBestE1RM) {
            sessionBestE1RM = e1rm;
            bestE1RMSet = { weight: w, reps: r };
          }
        });

        if (sessionBestE1RM > 0) {
          if (sessionBestE1RM > bestE1RM) bestE1RM = sessionBestE1RM;
          if (sessionMaxW > maxWeight) maxWeight = sessionMaxW;
          if (sessionVolume > bestVolume) bestVolume = sessionVolume;
          history.push({
            date: wk.date,
            workoutName: wk.name,
            sets,
            topSet: topSet || bestE1RMSet,
            bestSet: bestE1RMSet,
            maxWeight: sessionMaxW,
            e1rm: sessionBestE1RM,
            volume: sessionVolume
          });
        }
      });

      return {
        lastSession: history.length > 0 ? history[history.length - 1] : null,
        bestE1RM,
        maxWeight,
        bestVolume,
        history
      };
    }

    /**
     * Get all unique exercises ever logged OR present in any template.
     */
    function getAllExercisesList() {
      const set = new Set();
      appState.workouts.forEach(wk => {
        Object.keys(wk.setsByExercise || {}).forEach(n => set.add(n));
      });
      appState.templates.forEach(tpl => {
        (tpl.exercises || []).forEach(ex => set.add(ex.name));
      });
      return Array.from(set).sort();
    }

    /**
     * Check which splits were completed in the last 7 days (flexible, no forced order).
     */
    function getRecentSplitCompletions() {
      const todayStr = getLocalDateStr(new Date());
      const weekStartStr = shiftDateStr(todayStr, -6);
      const completedIds = new Set();

      appState.workouts.forEach(wk => {
        if (wk.date >= weekStartStr && wk.date <= todayStr && wk.templateId) {
          completedIds.add(wk.templateId);
        }
      });
      return completedIds;
    }

    /**
     * Daily nutrition totals for a YYYY-MM-DD date.
     */
    function getDailyNutritionTotals(dateStr) {
      const items = appState.nutrition[dateStr] || [];
      return items.reduce((acc, item) => {
        acc.calories += Number(item.calories) || 0;
        acc.protein += Number(item.protein) || 0;
        acc.carbs += Number(item.carbs) || 0;
        acc.fat += Number(item.fat) || 0;
        return acc;
      }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
    }

    /**
     * 7-day rolling average body weight ending on endDateStr.
     */
    function getRollingWeightAvg(endDateStr, windowDays = 7) {
      let sum = 0;
      let count = 0;
      for (let i = 0; i < windowDays; i++) {
        const d = shiftDateStr(endDateStr, -i);
        const w = appState.weights[d];
        if (typeof w === 'number' && !isNaN(w)) {
          sum += w;
          count++;
        }
      }
      return count > 0 ? sum / count : null;
    }

    /* =========================================================================
       5. NAVIGATION & RENDER ORCHESTRATION
       ========================================================================= */
    function switchTab(tabName) {
      currentTab = tabName;
      updateNavUI();
      renderCurrentTab();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function updateNavUI() {
      const subtitles = {
        today: 'Flexible PPLUL Dashboard',
        workouts: appState.activeWorkout ? 'Active Progressive Overload' : 'Jeff Nippard PPLUL Split',
        nutrition: 'Daily Calories & Protein',
        progress: 'Trends & Full Data Recall'
      };
      document.getElementById('header-subtitle').textContent = subtitles[currentTab] || '';

      const livePill = document.getElementById('active-workout-pill');
      if (appState.activeWorkout && currentTab !== 'workouts') {
        livePill.classList.remove('hidden');
        livePill.classList.add('flex');
      } else {
        livePill.classList.add('hidden');
        livePill.classList.remove('flex');
      }

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isTarget = btn.dataset.tab === currentTab;
        if (isTarget) {
          btn.classList.add('text-cyan-400', 'bg-cyan-500/10');
          btn.classList.remove('text-slate-500', 'hover:text-slate-300');
        } else {
          btn.classList.remove('text-cyan-400', 'bg-cyan-500/10');
          btn.classList.add('text-slate-500', 'hover:text-slate-300');
        }
      });
    }

    function renderCurrentTab() {
      destroyCharts();
      const main = document.getElementById('main-content');
      main.innerHTML = '';

      if (currentTab === 'today') {
        main.innerHTML = renderTodayTab();
      } else if (currentTab === 'workouts') {
        main.innerHTML = renderWorkoutsTab();
      } else if (currentTab === 'nutrition') {
        main.innerHTML = renderNutritionTab();
      } else if (currentTab === 'progress') {
        main.innerHTML = renderProgressTab();
        requestAnimationFrame(() => {
          initWeightNutritionChart();
          initOverloadChart();
        });
      }
      updateNavUI();
    }

    function destroyCharts() {
      if (weightNutritionChart) { weightNutritionChart.destroy(); weightNutritionChart = null; }
      if (overloadChart) { overloadChart.destroy(); overloadChart = null; }
    }

    function changeSelectedDate(delta) {
      selectedDate = shiftDateStr(selectedDate, delta);

      renderCurrentTab();

      selectedDate = getLocalDateStr(new Date());

        </div>
      `;

    function inspectWorkoutFromToday(workoutId) {
      expandedHistoryIds.add(workoutId);
      switchTab('progress');
    }

    function saveInlineWeight(e) {
      e.preventDefault();
      const input = document.getElementById('dashboard-weight-input');
      const val = parseFloat(input.value);
      if (isNaN(val) || val <= 0) {
        showToast('Enter a valid body weight.', 'warning');
        return;
      }
      appState.weights[selectedDate] = Number(toLbs(val).toFixed(2));
      // Mark this date as user-logged (no longer sample-only)
      if (appState.sampleWeightDates) delete appState.sampleWeightDates[selectedDate];
      saveState();
      showToast(`Saved ${val} ${getUnit()} for ${formatDateLabel(selectedDate)}`, 'success');
      renderCurrentTab();
    }

                  </div>
                  <svg class="w-5 h-5 text-slate-500 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"/></svg>
                </button>

                ${isOpen ? `
                  <div class="px-4 pb-4 pt-2 border-t border-slate-800/80 space-y-3 bg-slatebg-950/50">
                    ${Object.entries(wk.setsByExercise || {}).map(([exName, sets]) => `
                      <div class="space-y-1">
                        <p class="text-xs font-bold text-slate-200">${escapeHtml(exName)}</p>
                        <div class="flex flex-wrap gap-1.5">
                          ${sets.map((s, idx) => `
                            <span class="px-2 py-1 rounded-lg bg-slatebg-850 border border-slate-800 text-[11px] font-semibold text-slate-300">
                              S${idx + 1}: <strong class="text-white">${roundNiceWeight(fromLbs(s.weight, 2))}</strong> &times; ${s.reps}
                            </span>
                          `).join('')}
                        </div>
                      </div>
                    `).join('')}
                    <div class="pt-1 flex justify-end">

                        Delete Session
                      </button>
                    </div>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function toggleHistoryItem(id) {
      if (expandedHistoryIds.has(id)) expandedHistoryIds.delete(id);
      else expandedHistoryIds.add(id);
      renderCurrentTab();
    }

    /**
     * Start an active workout from a template, pre-filling inputs from the most recent session.
     */
    function startWorkoutFromTemplate(templateId) {
      const tpl = appState.templates.find(t => t.id === templateId);
      if (!tpl) return;

      const exercises = tpl.exercises.map(exCfg => {
        const stats = getExerciseHistoryStats(exCfg.name);
        const lastSets = stats.lastSession?.sets || [];
        const targetSetCount = Math.max(1, Number(exCfg.sets) || 3);
        const initialSets = [];

        for (let i = 0; i < targetSetCount; i++) {
          const ref = lastSets[i] || lastSets[lastSets.length - 1];
          initialSets.push({
            weight: ref ? roundNiceWeight(fromLbs(ref.weight, 2)) : '',
            reps: ref ? ref.reps : '',
            completed: false
          });
        }

        return {
          id: uid('ex'),
          name: exCfg.name,
          repMin: Number(exCfg.repMin) || 8,
          repMax: Number(exCfg.repMax) || 12,
          type: exCfg.type || 'compound',
          sets: initialSets
        };
      });

      appState.activeWorkout = {
        id: uid('active'),
        templateId: tpl.id,
        name: tpl.name,
        date: selectedDate || getLocalDateStr(new Date()),
        startedAt: Date.now(),
        exercises
      };
      saveState();
      currentTab = 'workouts';
      showToast(`Started ${tpl.name} — targets ready!`, 'info');
      renderCurrentTab();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

          <!-- Exercise Cards -->
          <div class="space-y-4">
            ${aw.exercises.map((ex, exIdx) => {

                ? `${fromLbs(stats.bestE1RM, 0)} ${getUnit()} e1RM (${roundNiceWeight(fromLbs(stats.maxWeight, 2))} max)`
                : 'No PR yet';

              // Live "NEXT WEEK TARGET" calculation from today's completed sets
              const completedTodayLbs = ex.sets
                .filter(s => s.completed && parseFloat(s.weight) > 0 && parseInt(s.reps, 10) > 0)

                ? calculateOverloadTarget(completedTodayLbs, ex)

              return `
                <div class="bg-slatebg-900 border border-slate-800/90 rounded-2xl overflow-hidden shadow-md">
                  <div class="p-4 space-y-3">

                    <div class="flex items-start justify-between gap-2">

                          <span class="px-1.5 py-0.5 rounded-md text-[9px] font-extrabold uppercase ${ex.type === 'compound' ? 'bg-amber-500/15 text-amber-300 border border-amber-500/30' : 'bg-slate-800 text-slate-400'}">

                          <p class="text-xs font-extrabold text-white mt-0.5">Aim for ${ex.repMin}–${ex.repMax} reps</p>
                          <p class="text-[11px] text-slate-400">Log today to unlock next-week targets</p>
                        `}
                      </div>
                      ${targetToday.hasHistory ? `
                        <button onclick="fillTargetForExercise(${exIdx})" class="shrink-0 min-h-[40px] px-3 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 text-[11px] font-black transition active:scale-95 shadow-md shadow-cyan-500/20">

                    <!-- Set Rows -->
                    <div class="space-y-2">
                      ${ex.sets.map((s, setIdx) => {
                        const wLbs = toLbs(s.weight);
                        const rNum = parseInt(s.reps, 10);
                        const e1rm = (wLbs && rNum) ? calcEpley1RM(wLbs, rNum) : 0;
                        const isPR = s.completed && e1rm > 0 && stats.bestE1RM > 0 && e1rm > stats.bestE1RM + 0.5;

                        return `
                          <div class="grid grid-cols-12 gap-2 items-center p-1.5 rounded-xl transition ${s.completed ? 'bg-emerald-500/15 border border-emerald-500/35' : 'bg-slatebg-850/90 border border-slate-800'}">
                            <div class="col-span-2 flex flex-col items-center justify-center">
                              <span class="text-xs font-black ${s.completed ? 'text-emerald-300' : 'text-slate-400'}">${setIdx + 1}</span>
                              ${isPR ? `<span class="text-[9px] font-black text-slate-950 bg-amber-400 px-1.5 py-0.5 rounded-full mt-0.5">PR!</span>` : ''}
                            </div>
                            <div class="col-span-4">
                              <input
                                type="number"
                                step="0.5"

                                placeholder="0"
                                oninput="updateActiveSet(${exIdx}, ${setIdx}, 'weight', this.value)"
                                class="w-full min-h-[44px] bg-slatebg-950 border border-slate-700/80 focus:border-cyan-400 focus:outline-none rounded-lg py-2 text-center text-sm font-extrabold text-white"

                                step="1"

                                class="w-full min-h-[44px] bg-slatebg-950 border border-slate-700/80 focus:border-cyan-400 focus:outline-none rounded-lg py-2 text-center text-sm font-extrabold text-white"

                              >
                                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                              </button>
                              ${ex.sets.length > 1 ? `
                                <button onclick="deleteActiveSet(${exIdx}, ${setIdx})" aria-label="Remove set" class="w-7 h-11 rounded-lg flex items-center justify-center text-slate-500 hover:text-rose-400 transition">
                                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                </button>

                      }).join('')}
                    </div>

                    <button onclick="addActiveSet(${exIdx})" class="w-full min-h-[40px] rounded-xl bg-slatebg-850 hover:bg-slatebg-800 border border-dashed border-slate-700 text-xs font-bold text-slate-300 transition active:scale-[0.99]">
                      + Add Set
                    </button>
                  </div>

                  <!-- LIVE "NEXT WEEK TARGET" PREVIEW FOOTER -->
                  <div class="px-4 py-2.5 border-t border-slate-800/90 ${nextWeekPreview ? 'bg-emerald-950/40' : 'bg-slatebg-950/60'} flex items-center justify-between gap-2">

                      Next Week Target
                    </span>
                    ${nextWeekPreview ? `
                      <span class="text-xs font-extrabold text-white text-right">
                        ${nextWeekPreview.targetWeightDisplay} ${getUnit()} &times; ${nextWeekPreview.targetRepsText} reps
                        <span class="text-emerald-400 ml-1">(${escapeHtml(nextWeekPreview.badgeDelta)})</span>
                      </span>

                      <span class="text-[11px] font-medium text-slate-500">Check off a set to preview</span>

                </div>

          </div>

          <!-- Add Ad-Hoc Exercise to Active Session -->
          <form onsubmit="addExerciseToActive(event)" class="bg-slatebg-900 border border-slate-800/90 rounded-2xl p-3 flex items-center gap-2">
            <input id="active-new-exercise" type="text" placeholder="Add an exercise to this session..." class="flex-1 min-h-[44px] bg-slatebg-850 border border-slate-700 focus:border-cyan-500 focus:outline-none rounded-xl px-3.5 text-xs font-bold text-white placeholder-slate-500" />
            <button type="submit" class="min-h-[44px] px-4 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-black transition active:scale-95">Add</button>
          </form>
        </div>
      `;
    }

    function fillTargetForExercise(exIdx) {
      if (!appState.activeWorkout) return;
      const ex = appState.activeWorkout.exercises[exIdx];
      const stats = getExerciseHistoryStats(ex.name);
      const target = calculateOverloadTarget(stats.lastSession?.sets || [], ex);
      if (!target.hasHistory) return;

      ex.sets.forEach(s => {
        if (!s.completed) {
          s.weight = target.targetWeightDisplay;
          s.reps = target.targetRepsFill;
        }
      });
      saveState();
      showToast(`Filled ${target.targetWeightDisplay} ${getUnit()} × ${target.targetRepsFill}`, 'info');
      renderCurrentTab();
    }

    function updateActiveSet(exIdx, setIdx, field, val) {
      if (!appState.activeWorkout) return;
      const s = appState.activeWorkout.exercises[exIdx].sets[setIdx];
      s[field] = val;
      saveState();
    }

    function toggleActiveSetComplete(exIdx, setIdx) {
      if (!appState.activeWorkout) return;
      const ex = appState.activeWorkout.exercises[exIdx];
      const setObj = ex.sets[setIdx];
      const willComplete = !setObj.completed;

      if (willComplete && (!parseFloat(setObj.weight) || !parseInt(setObj.reps, 10))) {
        showToast('Enter weight and reps before checking off.', 'warning');
        return;
      }

      setObj.completed = willComplete;
      saveState();

      if (willComplete) {
        const stats = getExerciseHistoryStats(ex.name);
        const wLbs = toLbs(setObj.weight);
        const rNum = parseInt(setObj.reps, 10);
        const e1rm = calcEpley1RM(wLbs, rNum);
        if (stats.bestE1RM > 0 && e1rm > stats.bestE1RM + 0.5) {
          showToast(`New All-Time e1RM PR on ${ex.name}!`, 'warning');
        }
        resetRestTimer();
        startRestTimer();
      }
      renderCurrentTab();
    }

    function addActiveSet(exIdx) {
      const sets = appState.activeWorkout.exercises[exIdx].sets;
      const prev = sets[sets.length - 1] || { weight: '', reps: '' };
      sets.push({ weight: prev.weight, reps: prev.reps, completed: false });
      saveState();
      renderCurrentTab();
    }

    function deleteActiveSet(exIdx, setIdx) {
      appState.activeWorkout.exercises[exIdx].sets.splice(setIdx, 1);
      saveState();
      renderCurrentTab();
    }

    function addExerciseToActive(e) {
      e.preventDefault();
      const input = document.getElementById('active-new-exercise');
      const name = input.value.trim();
      if (!name) return;
      appState.activeWorkout.exercises.push({
        id: uid('ex'),
        name,
        repMin: 8,
        repMax: 12,
        type: 'isolation',
        sets: [
          { weight: '', reps: '', completed: false },
          { weight: '', reps: '', completed: false },
          { weight: '', reps: '', completed: false }
        ]
      });
      saveState();
      renderCurrentTab();
    }

    function removeExerciseFromActive(exIdx) {
      appState.activeWorkout.exercises.splice(exIdx, 1);
      saveState();
      renderCurrentTab();
    }

    /**
     * Finish Active Workout, save to history, and open the Next-Week Targets Summary Modal.
     */
    function finishActiveWorkout() {
      const aw = appState.activeWorkout;
      if (!aw) return;

      const setsByExercise = {};
      const nextWeekSummary = [];
      let totalVolume = 0;
      let totalCompletedSets = 0;
      let prsHitCount = 0;

      aw.exercises.forEach(ex => {
        const priorStats = getExerciseHistoryStats(ex.name);
        const validSets = ex.sets
          .filter(s => s.completed && parseFloat(s.weight) > 0 && parseInt(s.reps, 10) > 0)
          .map(s => {
            const wLbs = Number(toLbs(s.weight).toFixed(2));
            const r = parseInt(s.reps, 10);
            totalVolume += wLbs * r;
            totalCompletedSets++;
            return { weight: wLbs, reps: r, completed: true };
          });

        if (validSets.length > 0) {
          setsByExercise[ex.name] = validSets;
          const topSet = getTopWorkingSet(validSets);
          const sessionMaxE1RM = Math.max(...validSets.map(s => calcEpley1RM(s.weight, s.reps)));
          const hitPR = priorStats.bestE1RM > 0 && sessionMaxE1RM > priorStats.bestE1RM + 0.5;
          if (hitPR) prsHitCount++;

          const nextTarget = calculateOverloadTarget(validSets, ex);
          nextWeekSummary.push({
            name: ex.name,
            hitPR,
            todayBest: `${roundNiceWeight(fromLbs(topSet.weight, 2))} ${getUnit()} × ${topSet.reps}`,
            nextTarget: `${nextTarget.targetWeightDisplay} ${getUnit()} × ${nextTarget.targetRepsText}`,
            delta: nextTarget.badgeDelta
          });
        }
      });

      if (totalCompletedSets === 0) {
        showToast('Check off at least one set before finishing.', 'warning');
        return;
      }

      const durationMinutes = Math.max(1, Math.round((Date.now() - aw.startedAt) / 60000));
      const completedName = aw.name;

      appState.workouts.push({
        id: uid('wk'),
        date: aw.date || getLocalDateStr(new Date()),
        templateId: aw.templateId,
        name: completedName,
        durationMinutes,
        setsByExercise,
        totalVolume: Math.round(totalVolume),
        isSample: false
      });

      stopRestTimer();
      appState.activeWorkout = null;
      saveState();
      renderCurrentTab();

      openFinishSummaryModal(completedName, totalCompletedSets, totalVolume, prsHitCount, nextWeekSummary);
    }

    function openFinishSummaryModal(workoutName, totalSets, totalVolumeLbs, prsHitCount, nextWeekSummary) {
      const panel = document.getElementById('modal-panel');
      panel.innerHTML = `
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
          <div>
            <span class="text-[10px] font-black uppercase tracking-wider text-emerald-400">Session Complete!</span>
            <h3 class="text-base font-black text-white">${escapeHtml(workoutName)}</h3>
          </div>
          <button onclick="closeModal()" class="w-10 h-10 rounded-xl bg-slatebg-850 flex items-center justify-center text-slate-400 hover:text-white">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="p-4 space-y-4 overflow-y-auto">
          <div class="grid grid-cols-3 gap-2">
            <div class="bg-slatebg-850 border border-slate-800 rounded-xl p-3 text-center">
              <p class="text-[10px] font-bold uppercase text-slate-400">Sets</p>
              <p class="text-lg font-black text-emerald-400 mt-0.5">${totalSets}</p>
            </div>
            <div class="bg-slatebg-850 border border-slate-800 rounded-xl p-3 text-center">
              <p class="text-[10px] font-bold uppercase text-slate-400">Volume</p>
              <p class="text-lg font-black text-cyan-300 mt-0.5">${Math.round(fromLbs(totalVolumeLbs, 0)).toLocaleString()}</p>
            </div>
            <div class="bg-slatebg-850 border border-slate-800 rounded-xl p-3 text-center">
              <p class="text-[10px] font-bold uppercase text-slate-400">PRs Hit</p>
              <p class="text-lg font-black text-amber-400 mt-0.5">${prsHitCount}</p>
            </div>

    /* --- Rest Timer Controls --- */
    function setRestTimer(seconds) {
      stopRestTimer();
      restTimer.duration = seconds;
      restTimer.remaining = seconds;
      renderCurrentTab();
    }

    function setCustomRestTimer(val) {
      const secs = parseInt(val, 10);
      if (isNaN(secs) || secs < 10 || secs > 600) return;
      setRestTimer(secs);
    }

    function startRestTimer() {
      if (restTimer.running) return;
      if (restTimer.remaining <= 0) restTimer.remaining = restTimer.duration;
      restTimer.running = true;
      restTimer.intervalId = setInterval(() => {
        restTimer.remaining--;
        if (restTimer.remaining <= 0) {
          restTimer.remaining = 0;
          stopRestTimer();
          playTimerChime();
          showToast('Rest complete — hit your next set!', 'success');
        }
        updateRestTimerDOM();
      }, 1000);
      updateRestTimerDOM();
    }

    function stopRestTimer() {
      restTimer.running = false;
      if (restTimer.intervalId) {
        clearInterval(restTimer.intervalId);
        restTimer.intervalId = null;
      }
      updateRestTimerDOM();
    }

    function toggleRestTimer() {
      if (restTimer.running) stopRestTimer();
      else startRestTimer();
    }

    function resetRestTimer() {
      stopRestTimer();
      restTimer.remaining = restTimer.duration;
      updateRestTimerDOM();
    }

    function updateRestTimerDOM() {
      const disp = document.getElementById('rest-timer-display');
      const btn = document.getElementById('rest-timer-toggle');
      if (disp) {
        const m = Math.floor(restTimer.remaining / 60);
        const s = String(restTimer.remaining % 60).padStart(2, '0');
        disp.textContent = `${m}:${s}`;
        disp.classList.toggle('text-emerald-400', restTimer.running);
        disp.classList.toggle('text-white', !restTimer.running);
      }
      if (btn) {
        btn.textContent = restTimer.running ? 'Pause' : 'Start';
        btn.className = `min-h-[38px] px-3.5 rounded-lg text-xs font-extrabold transition ${restTimer.running ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'}`;
      }
    }

    function handleAddMeal(e) {
      e.preventDefault();
      const name = document.getElementById('meal-name-input').value.trim();
      const calories = parseInt(document.getElementById('meal-cal-input').value, 10) || 0;
      const protein = parseInt(document.getElementById('meal-pro-input').value, 10) || 0;
      const carbs = parseInt(document.getElementById('meal-carb-input').value, 10) || 0;
      const fat = parseInt(document.getElementById('meal-fat-input').value, 10) || 0;
      const saveQuick = document.getElementById('meal-save-quick').checked;

      if (!name) return;
      if (!appState.nutrition[selectedDate]) appState.nutrition[selectedDate] = [];
      appState.nutrition[selectedDate].push({
        id: uid('meal'),
        name,
        calories,
        protein,
        carbs,
        fat,
        time: new Date().toTimeString().slice(0, 5),
        isSample: false
      });

      if (saveQuick) {
        appState.quickFoods.unshift({ id: uid('qf'), name, calories, protein, carbs, fat });
      }
      saveState();
      showToast(`Logged ${name} (${calories} kcal, ${protein}g P)`, 'success');
      renderCurrentTab();
    }

            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

        <form onsubmit="saveEditedMeal(event, '${mealId}')" class="p-4 space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-400 mb-1">Meal Name</label>
            <input id="edit-meal-name" type="text" required value="${escapeHtml(item.name)}" class="w-full min-h-[44px] bg-slatebg-850 border border-slate-700 rounded-xl px-3.5 text-sm font-bold text-white" />

            <div>
              <label class="block text-xs font-bold text-slate-400 mb-1">Protein (g)</label>

            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">Carbs (g)</label>
              <input id="edit-meal-carb" type="number" min="0" value="${item.carbs || 0}" class="w-full min-h-[40px] bg-slatebg-850 border border-slate-800 rounded-xl px-3 text-xs font-bold text-slate-200" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">Fat (g)</label>
              <input id="edit-meal-fat" type="number" min="0" value="${item.fat || 0}" class="w-full min-h-[40px] bg-slatebg-850 border border-slate-800 rounded-xl px-3 text-xs font-bold text-slate-200" />
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="min-h-[42px] px-4 rounded-xl bg-slatebg-850 text-slate-300 text-xs font-bold">Cancel</button>
            <button type="submit" class="min-h-[42px] px-5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-black">Save</button>
          </div>
        </form>
      `;
      openModal();
    }

    function saveEditedMeal(e, mealId) {
      e.preventDefault();
      const list = appState.nutrition[selectedDate] || [];
      const item = list.find(m => m.id === mealId);
      if (!item) return;
      item.name = document.getElementById('edit-meal-name').value.trim() || item.name;
      item.calories = parseInt(document.getElementById('edit-meal-cal').value, 10) || 0;
      item.protein = parseInt(document.getElementById('edit-meal-pro').value, 10) || 0;
      item.carbs = parseInt(document.getElementById('edit-meal-carb').value, 10) || 0;
      item.fat = parseInt(document.getElementById('edit-meal-fat').value, 10) || 0;
      item.isSample = false;
      saveState();
      closeModal();
      showToast('Meal updated!', 'success');
      renderCurrentTab();
    }

    function addQuickFood(qfId) {
      const qf = appState.quickFoods.find(q => q.id === qfId);
      if (!qf) return;
      if (!appState.nutrition[selectedDate]) appState.nutrition[selectedDate] = [];
      appState.nutrition[selectedDate].push({
        id: uid('meal'),
        name: qf.name,
        calories: qf.calories,
        protein: qf.protein,
        carbs: qf.carbs || 0,
        fat: qf.fat || 0,
        time: new Date().toTimeString().slice(0, 5),
        isSample: false
      });
      saveState();
      showToast(`+1 ${qf.name}`, 'success');
      renderCurrentTab();
    }

    function deleteQuickFood(qfId) {
      appState.quickFoods = appState.quickFoods.filter(q => q.id !== qfId);
      saveState();
      renderCurrentTab();
    }

    function deleteLoggedFood(mealId) {
      if (!appState.nutrition[selectedDate]) return;
      appState.nutrition[selectedDate] = appState.nutrition[selectedDate].filter(m => m.id !== mealId);
      saveState();
      renderCurrentTab();
    }

    /* =========================================================================
       9. TAB 4: PROGRESS & DATA RECALL (TRENDS + FULL EXERCISE & WORKOUT LOG)
       ========================================================================= */

    /**
     * Build date array for selected timeframe ('7d' | '14d' | '30d' | '90d' | 'all').
     */
    function getProgressDateSeries() {
      const todayStr = getLocalDateStr(new Date());
      let days = 14;
      if (progressRange === '7d') days = 7;
      else if (progressRange === '14d') days = 14;
      else if (progressRange === '30d') days = 30;
      else if (progressRange === '90d') days = 90;
      else if (progressRange === 'all') {
        const allDates = [
          ...Object.keys(appState.weights || {}),
          ...Object.keys(appState.nutrition || {}),
          ...(appState.workouts || []).map(w => w.date),
          todayStr
        ].filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
        const earliest = allDates[0] || todayStr;
        const [y1, m1, d1] = earliest.split('-').map(Number);
        const [y2, m2, d2] = todayStr.split('-').map(Number);
        const diffDays = Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 86400000) + 1;
        days = Math.max(7, Math.min(730, diffDays));
      }

      const list = [];
      for (let i = days - 1; i >= 0; i--) {
        list.push(shiftDateStr(todayStr, -i));
      }
      return list;
    }

    function renderProgressTab() {
      const dates = getProgressDateSeries();
      const startDate = dates[0];
      const endDate = dates[dates.length - 1];

      // Compute KPIs for the selected timeframe
      let calSum = 0, proSum = 0, nutDays = 0;
      dates.forEach(d => {
        const t = getDailyNutritionTotals(d);
        if (t.calories > 0 || t.protein > 0) {
          calSum += t.calories;
          proSum += t.protein;
          nutDays++;
        }
      });
      const avgCals = nutDays ? Math.round(calSum / nutDays) : 0;
      const avgPro = nutDays ? Math.round(proSum / nutDays) : 0;

      // 7-day rolling weight trend across the selected timeframe
      const startRolling = getRollingWeightAvg(startDate, 7);
      const endRolling = getRollingWeightAvg(endDate, 7);
      const weightTrendLbs = (startRolling !== null && endRolling !== null) ? (endRolling - startRolling) : null;

      // Total workouts in selected timeframe
      const workoutsInPeriod = appState.workouts.filter(w => w.date >= startDate && w.date <= endDate).length;

      // Progressive Overload exercise selector
      const allExercises = getAllExercisesList();
      if (!selectedProgressExercise || !allExercises.includes(selectedProgressExercise)) {
        selectedProgressExercise = allExercises.includes('Flat Barbell Bench Press')
          ? 'Flat Barbell Bench Press'
          : (allExercises[0] || '');
      }
      const exStats = selectedProgressExercise ? getExerciseHistoryStats(selectedProgressExercise) : null;
      const exCfg = selectedProgressExercise ? findExerciseConfig(selectedProgressExercise) : null;
      const nextTargetObj = (exStats && exCfg)
        ? calculateOverloadTarget(exStats.lastSession?.sets || [], exCfg)
        : null;

      const sortedAllWorkouts = [...appState.workouts].sort((a, b) => b.date.localeCompare(a.date));

      return `
        <div class="tab-fade space-y-5">
          <!-- Timeframe Filter Pills (7D / 14D / 30D / 90D / All Time) -->
          <div class="grid grid-cols-5 gap-1 bg-slatebg-900 p-1.5 rounded-2xl border border-slate-800">
            ${[
              { key: '7d', label: '7D' },
              { key: '14d', label: '14D' },
              { key: '30d', label: '30D' },
              { key: '90d', label: '90D' },
              { key: 'all', label: 'All' }
            ].map(r => `
              <button onclick="setProgressRange('${r.key}')" class="min-h-[36px] rounded-xl text-[11px] font-black transition ${progressRange === r.key ? 'bg-cyan-500 text-slate-950 shadow-sm' : 'text-slate-400 hover:text-white'}">
                ${r.label}
              </button>
            `).join('')}
          </div>

          <!-- Summary KPI Cards for Selected Timeframe -->
          <div class="grid grid-cols-2 gap-2.5">
            <div class="bg-slatebg-900 border border-slate-800/90 rounded-2xl p-3.5">
              <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Avg Calories</p>
              <p class="text-lg font-black text-cyan-300 mt-0.5">${avgCals ? avgCals.toLocaleString() : '--'} <span class="text-xs font-semibold text-slate-500">kcal</span></p>
            </div>
            <div class="bg-slatebg-900 border border-slate-800/90 rounded-2xl p-3.5">
              <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Avg Protein</p>
              <p class="text-lg font-black text-emerald-400 mt-0.5">${avgPro || '--'} <span class="text-xs font-semibold text-slate-500">g/day</span></p>
            </div>
            <div class="bg-slatebg-900 border border-slate-800/90 rounded-2xl p-3.5">
              <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Weight Trend (7d Avg)</p>
              <p class="text-lg font-black mt-0.5 ${weightTrendLbs !== null ? (weightTrendLbs <= 0 ? 'text-emerald-400' : 'text-amber-400') : 'text-slate-400'}">
                ${weightTrendLbs !== null ? `${weightTrendLbs > 0 ? '+' : ''}${fromLbs(weightTrendLbs, 1)} ${getUnit()}` : '--'}
              </p>
            </div>
            <div class="bg-slatebg-900 border border-slate-800/90 rounded-2xl p-3.5">
              <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Total Workouts</p>
              <p class="text-lg font-black text-white mt-0.5">${workoutsInPeriod} <span class="text-xs font-semibold text-slate-500">sessions</span></p>
            </div>
          </div>

          <!-- Chart 1: Body Weight vs Calories / Protein -->
          <section class="bg-slatebg-900 border border-slate-800/90 rounded-2xl p-4 space-y-4">
            <div class="flex items-start justify-between gap-2">
              <div>
                <h2 class="text-sm font-black text-white">Weight vs. Nutrition</h2>
                <p class="text-[11px] text-slate-400">Daily weight + 7d avg vs intake</p>
              </div>
              <div class="inline-flex rounded-xl bg-slatebg-950 p-1 border border-slate-800">
                <button onclick="setProgressNutritionMetric('calories')" class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold transition ${progressNutritionMetric === 'calories' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400 hover:text-white'}">Calories</button>
                <button onclick="setProgressNutritionMetric('protein')" class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold transition ${progressNutritionMetric === 'protein' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'}">Protein</button>
              </div>
            </div>

            <div class="relative h-64 w-full">
              <canvas id="weight-nutrition-canvas"></canvas>
            </div>
          </section>

          <!-- Chart 2: Progressive Overload Exercise Tracker -->
          <section class="bg-slatebg-900 border border-slate-800/90 rounded-2xl p-4 space-y-4">
            <div>
              <h2 class="text-sm font-black text-white">Progressive Overload Tracker</h2>
              <p class="text-[11px] text-slate-400">Inspect any exercise ever logged</p>
            </div>

            ${allExercises.length === 0 ? `
              <div class="p-6 rounded-xl bg-slatebg-850/60 border border-dashed border-slate-800 text-center text-xs text-slate-500">
                Complete a workout to unlock progressive overload charts.
              </div>
            ` : `
              <!-- Exercise Dropdown -->
              <select onchange="setSelectedProgressExercise(this.value)" class="w-full min-h-[44px] bg-slatebg-850 border border-slate-700 rounded-xl px-3.5 text-sm font-extrabold text-white focus:border-cyan-500 focus:outline-none">
                ${allExercises.map(ex => `<option value="${escapeHtml(ex)}" ${ex === selectedProgressExercise ? 'selected' : ''}>${escapeHtml(ex)}</option>`).join('')}
              </select>

              <!-- Current Next Target Banner -->
              ${nextTargetObj && nextTargetObj.hasHistory ? `
                <div class="rounded-xl bg-gradient-to-r from-cyan-500/15 to-emerald-500/15 border border-cyan-500/40 p-3 flex items-center justify-between gap-2">
                  <div>
                    <span class="text-[10px] font-black uppercase tracking-wider text-cyan-300">Next Session Target</span>
                    <p class="text-sm font-black text-white mt-0.5">${nextTargetObj.targetWeightDisplay} ${getUnit()} &times; ${nextTargetObj.targetRepsText} reps</p>
                  </div>
                  <span class="px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 text-[11px] font-extrabold">
                    ${escapeHtml(nextTargetObj.badgeDelta)}

                </div>
              ` : ''}

              <!-- Lift PR Badges -->
              <div class="grid grid-cols-3 gap-2">
                <div class="bg-slatebg-850 border border-slate-800 rounded-xl p-2.5 text-center">
                  <p class="text-[10px] font-bold uppercase text-slate-500">Est. 1RM PR</p>
                  <p class="text-sm font-black text-amber-400 mt-0.5">${exStats.bestE1RM ? `${fromLbs(exStats.bestE1RM, 0)} ${getUnit()}` : '--'}</p>
                </div>
                <div class="bg-slatebg-850 border border-slate-800 rounded-xl p-2.5 text-center">
                  <p class="text-[10px] font-bold uppercase text-slate-500">Max Weight</p>
                  <p class="text-sm font-black text-cyan-300 mt-0.5">${exStats.maxWeight ? `${roundNiceWeight(fromLbs(exStats.maxWeight, 2))} ${getUnit()}` : '--'}</p>
                </div>
                <div class="bg-slatebg-850 border border-slate-800 rounded-xl p-2.5 text-center">
                  <p class="text-[10px] font-bold uppercase text-slate-500">Best Volume</p>
                  <p class="text-sm font-black text-emerald-400 mt-0.5">${exStats.bestVolume ? Math.round(fromLbs(exStats.bestVolume, 0)).toLocaleString() : '--'}</p>
                </div>
              </div>

              <!-- Metric Switcher -->
              <div class="grid grid-cols-3 gap-1.5 bg-slatebg-950 p-1 rounded-xl border border-slate-800">
                <button onclick="setProgressLiftMetric('e1rm')" class="min-h-[36px] rounded-lg text-[11px] font-extrabold transition ${progressLiftMetric === 'e1rm' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'text-slate-400 hover:text-white'}">Est. 1RM</button>
                <button onclick="setProgressLiftMetric('maxWeight')" class="min-h-[36px] rounded-lg text-[11px] font-extrabold transition ${progressLiftMetric === 'maxWeight' ? 'bg-cyan-500/20 text-cyan-300 border border-cyan-500/40' : 'text-slate-400 hover:text-white'}">Max Weight</button>
                <button onclick="setProgressLiftMetric('volume')" class="min-h-[36px] rounded-lg text-[11px] font-extrabold transition ${progressLiftMetric === 'volume' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'text-slate-400 hover:text-white'}">Volume</button>
              </div>

              <!-- Overload Chart -->
              <div class="relative h-56 w-full">
                <canvas id="overload-chart-canvas"></canvas>
              </div>

              <!-- Complete Exercise History Recall Table -->
              ${exStats.history.length > 0 ? `
                <div class="space-y-1.5">
                  <p class="text-[11px] font-black uppercase tracking-wider text-slate-400">Exercise Recall Log (${exStats.history.length} sessions)</p>
                  <div class="overflow-x-auto rounded-xl border border-slate-800">
                    <table class="w-full text-left text-xs">
                      <thead class="bg-slatebg-850 text-slate-400 text-[10px] uppercase">
                        <tr>
                          <th class="py-2 px-3">Date</th>
                          <th class="py-2 px-2">Sets &times; Reps @ ${getUnit()}</th>
                          <th class="py-2 px-2 text-right">e1RM</th>
                          <th class="py-2 px-3 text-right">Vol</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-800/80 bg-slatebg-950/40">
                        ${[...exStats.history].reverse().map(h => {
                          const setsSummary = h.sets.map(s => `${roundNiceWeight(fromLbs(s.weight, 2))}×${s.reps}`).join(', ');
                          return `
                            <tr>
                              <td class="py-2.5 px-3 font-semibold text-slate-300 whitespace-nowrap">${formatShortChartDate(h.date)}</td>
                              <td class="py-2.5 px-2 font-bold text-white">${escapeHtml(setsSummary)}</td>
                              <td class="py-2.5 px-2 text-right font-extrabold text-amber-400 whitespace-nowrap">${fromLbs(h.e1rm, 0)}</td>
                              <td class="py-2.5 px-3 text-right font-semibold text-slate-400 whitespace-nowrap">${Math.round(fromLbs(h.volume, 0)).toLocaleString()}</td>
                            </tr>
                          `;
                        }).join('')}
                      </tbody>
                    </table>
                  </div>
                </div>
              ` : ''}
            `}
          </section>

          <!-- Full Workout History Recall List -->
          <section class="space-y-3">
            <div class="flex items-center justify-between px-0.5">
              <h2 class="text-base font-black text-white">Full Workout History</h2>
              <span class="text-xs font-bold text-slate-500">${sortedAllWorkouts.length} total</span>
            </div>
            ${renderWorkoutHistoryList(sortedAllWorkouts)}
          </section>
        </div>
      `;
    }

    function setProgressNutritionMetric(m) { progressNutritionMetric = m; renderCurrentTab(); }
    function setProgressRange(r) { progressRange = r; renderCurrentTab(); }
    function setSelectedProgressExercise(ex) { selectedProgressExercise = ex; renderCurrentTab(); }
    function setProgressLiftMetric(m) { progressLiftMetric = m; renderCurrentTab(); }

    function initWeightNutritionChart() {
      const ctx = document.getElementById('weight-nutrition-canvas');
      if (!ctx) return;

      const dates = getProgressDateSeries();
      const labels = dates.map(formatShortChartDate);
      const dailyWeights = dates.map(d => (typeof appState.weights[d] === 'number' ? fromLbs(appState.weights[d], 1) : null));
      const rollingAvgs = dates.map(d => {
        const avg = getRollingWeightAvg(d, 7);
        return avg !== null ? fromLbs(avg, 1) : null;
      });
      const isCals = progressNutritionMetric === 'calories';
      const nutBars = dates.map(d => {
        const t = getDailyNutritionTotals(d);
        return isCals ? t.calories : t.protein;
      });

      weightNutritionChart = new Chart(ctx, {
        data: {
          labels,
          datasets: [
            {
              type: 'line',
              label: `7d Avg (${getUnit()})`,
              data: rollingAvgs,
              borderColor: '#f59e0b',
              backgroundColor: '#f59e0b',
              borderWidth: 2.5,
              pointRadius: 0,
              tension: 0.35,
              yAxisID: 'yWeight',
              spanGaps: true
            },
            {
              type: 'line',
              label: `Daily Weight (${getUnit()})`,
              data: dailyWeights,
              borderColor: 'rgba(241, 245, 249, 0.55)',
              backgroundColor: '#ffffff',
              borderWidth: 1.5,
              pointRadius: dates.length > 21 ? 1.5 : 3,
              tension: 0.2,
              yAxisID: 'yWeight',
              spanGaps: true
            },
            {
              type: 'bar',
              label: isCals ? 'Calories (kcal)' : 'Protein (g)',
              data: nutBars,
              backgroundColor: isCals ? 'rgba(6, 182, 212, 0.30)' : 'rgba(16, 185, 129, 0.30)',
              borderColor: isCals ? 'rgba(34, 211, 238, 0.7)' : 'rgba(52, 211, 153, 0.7)',
              borderWidth: 1,
              borderRadius: 5,
              yAxisID: 'yNut'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { labels: { color: '#94a3b8', boxWidth: 10, font: { size: 11, family: 'Inter' } } },
            tooltip: {
              backgroundColor: '#111827',
              borderColor: '#334155',
              borderWidth: 1,
              titleColor: '#ffffff',
              bodyColor: '#cbd5e1'
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 10 }, maxTicksLimit: 8 } },
            yWeight: {
              type: 'linear',
              position: 'left',
              grid: { color: 'rgba(51, 65, 85, 0.4)' },

              type: 'linear',

              grid: { display: false },
              ticks: { color: isCals ? '#22d3ee' : '#34d399', font: { size: 10 } }
            }
          }
        }
      });
    }

    function initOverloadChart() {
      const ctx = document.getElementById('overload-chart-canvas');
      if (!ctx || !selectedProgressExercise) return;

      const stats = getExerciseHistoryStats(selectedProgressExercise);
      const labels = stats.history.map(h => formatShortChartDate(h.date));
      const dataPoints = stats.history.map(h => {
        if (progressLiftMetric === 'e1rm') return fromLbs(h.e1rm, 1);
        if (progressLiftMetric === 'maxWeight') return roundNiceWeight(fromLbs(h.maxWeight, 2));
        return Math.round(fromLbs(h.volume, 0));
      });

      const meta = {
        e1rm: { label: `Est. 1RM (${getUnit()})`, color: '#f59e0b', bg: 'rgba(245, 158, 11, 0.16)' },
        maxWeight: { label: `Max Weight (${getUnit()})`, color: '#22d3ee', bg: 'rgba(34, 211, 238, 0.16)' },
        volume: { label: `Total Volume (${getUnit()})`, color: '#10b981', bg: 'rgba(16, 185, 129, 0.16)' }
      }[progressLiftMetric];

      overloadChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: meta.label,
            data: dataPoints,
            borderColor: meta.color,
            backgroundColor: meta.bg,
            borderWidth: 2.5,
            fill: true,
            pointRadius: 4,
            pointBackgroundColor: meta.color,
            tension: 0.25
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#111827',
              borderColor: '#334155',
              borderWidth: 1,
              titleColor: '#ffffff',
              bodyColor: '#cbd5e1'
            }
          },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 10 } } },
            y: { grid: { color: 'rgba(51, 65, 85, 0.4)' }, ticks: { color: '#cbd5e1', font: { size: 10 } } }
