    /* =========================================================================
       10. SETTINGS, IMPORT/MERGE & CONFIRMATION MODALS (NO alert / confirm)
       ========================================================================= */
    function openModal() {
      const root = document.getElementById('modal-root');
      root.classList.remove('hidden');
      root.classList.add('flex');
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.classList.remove('flex');
    }

    function openConfirmModal(title, message, confirmLabel, onConfirm) {
      const panel = document.getElementById('modal-panel');
      panel.innerHTML = `
        <div class="p-5 space-y-4">
          <h3 class="text-base font-black text-white">${escapeHtml(title)}</h3>
          <p class="text-xs text-slate-400 leading-relaxed">${escapeHtml(message)}</p>
          <div class="flex items-center justify-end gap-2 pt-2">
            <button onclick="closeModal()" class="min-h-[42px] px-4 rounded-xl bg-slatebg-850 text-slate-300 text-xs font-bold">Cancel</button>
            <button id="confirm-modal-action" class="min-h-[42px] px-4 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-black">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      `;
      document.getElementById('confirm-modal-action').onclick = () => {
        closeModal();
        onConfirm();
      };
      openModal();
    }

    function openSettingsModal() {
      const s = appState.settings;
      const isKg = s.unit === 'kg';
      const panel = document.getElementById('modal-panel');
      panel.innerHTML = `
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
          <h3 class="text-base font-black text-white">Settings &amp; Data Recall</h3>
          <button onclick="closeModal()" class="w-10 h-10 rounded-xl bg-slatebg-850 flex items-center justify-center text-slate-400 hover:text-white">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <form onsubmit="saveSettingsForm(event)" class="p-4 space-y-4 overflow-y-auto">
          <!-- Progression Mode Selector -->
          <div class="space-y-2">
            <label class="block text-xs font-extrabold text-cyan-400 uppercase tracking-wider">Progressive Overload Mode</label>
            <select id="set-prog-mode" class="w-full min-h-[44px] bg-slatebg-850 border border-slate-700 rounded-xl px-3.5 text-xs font-extrabold text-white focus:border-cyan-500 focus:outline-none">
              <option value="weight_first" ${s.progressionMode === 'weight_first' ? 'selected' : ''}>Weight-First Overload (Add weight once min reps hit)</option>
              <option value="double_progression" ${s.progressionMode === 'double_progression' ? 'selected' : ''}>Double Progression (Jeff Nippard — hit top reps, then add weight)</option>
            </select>
          </div>

          <!-- Custom Increments -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-400 mb-1">Compound Step (${s.unit})</label>
              <input id="set-comp-inc" type="number" step="0.25" min="0.5" max="50" value="${isKg ? s.compoundIncrementKg : s.compoundIncrementLbs}" class="w-full min-h-[44px] bg-slatebg-850 border border-slate-700 rounded-xl px-3 text-sm font-extrabold text-amber-300" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-400 mb-1">Isolation Step (${s.unit})</label>
              <input id="set-iso-inc" type="number" step="0.25" min="0.25" max="25" value="${isKg ? s.isolationIncrementKg : s.isolationIncrementLbs}" class="w-full min-h-[44px] bg-slatebg-850 border border-slate-700 rounded-xl px-3 text-sm font-extrabold text-cyan-300" />
            </div>
          </div>

          <!-- Nutrition & Weight Goals -->
          <div class="grid grid-cols-2 gap-3 pt-1 border-t border-slate-800/80">
            <div>
              <label class="block text-xs font-bold text-slate-400 mb-1">Daily Calories</label>
              <input id="set-cal" type="number" min="800" max="8000" value="${s.calorieTarget}" class="w-full min-h-[44px] bg-slatebg-850 border border-slate-700 rounded-xl px-3 text-sm font-extrabold text-white" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-400 mb-1">Daily Protein (g)</label>
              <input id="set-pro" type="number" min="30" max="500" value="${s.proteinTarget}" class="w-full min-h-[44px] bg-slatebg-850 border border-slate-700 rounded-xl px-3 text-sm font-extrabold text-emerald-400" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-400 mb-1">Goal Weight (${s.unit})</label>
              <input id="set-goal-weight" type="number" step="0.1" value="${fromLbs(s.goalWeight, 1)}" class="w-full min-h-[44px] bg-slatebg-850 border border-slate-700 rounded-xl px-3 text-sm font-extrabold text-white" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-400 mb-1">Weight Unit</label>
              <select id="set-unit" class="w-full min-h-[44px] bg-slatebg-850 border border-slate-700 rounded-xl px-3 text-sm font-extrabold text-white">
                <option value="lbs" ${s.unit === 'lbs' ? 'selected' : ''}>Pounds (lbs)</option>
                <option value="kg" ${s.unit === 'kg' ? 'selected' : ''}>Kilograms (kg)</option>
              </select>
            </div>
          </div>

          <button type="submit" class="w-full min-h-[46px] rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 text-xs font-black transition active:scale-[0.99]">
            Save Settings
          </button>

          <!-- Data Management -->
          <div class="pt-3 border-t border-slate-800 space-y-2.5">
            <p class="text-xs font-extrabold text-slate-400 uppercase tracking-wider">Data Management &amp; Backup</p>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" onclick="exportDataJSON()" class="min-h-[42px] rounded-xl bg-slatebg-850 hover:bg-slatebg-800 border border-slate-700 text-slate-200 text-xs font-bold transition">
                Export JSON
              </button>
              <button type="button" onclick="triggerImportJSON()" class="min-h-[42px] rounded-xl bg-slatebg-850 hover:bg-slatebg-800 border border-slate-700 text-cyan-300 text-xs font-bold transition">
                Import / Restore
              </button>
            </div>
            <button type="button" onclick="confirmClearSampleDataKeepLogs()" class="w-full min-h-[42px] rounded-xl bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/35 text-amber-300 text-xs font-extrabold transition">
              Clear Sample Data (Keep My Logs)
            </button>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" onclick="confirmReloadSampleData()" class="min-h-[40px] rounded-xl bg-slatebg-850 hover:bg-slatebg-800 border border-slate-800 text-slate-400 hover:text-white text-xs font-bold transition">
                Load 14d Sample
              </button>
              <button type="button" onclick="confirmResetAllData()" class="min-h-[40px] rounded-xl bg-rose-500/15 hover:bg-rose-500/25 border border-rose-500/30 text-rose-300 text-xs font-bold transition">
                Reset All Data
              </button>
            </div>
          </div>
        </form>
      `;
      openModal();
    }

    function saveSettingsForm(e) {
      e.preventDefault();
      const oldUnit = appState.settings.unit;
      const newUnit = document.getElementById('set-unit').value;
      const goalInput = parseFloat(document.getElementById('set-goal-weight').value);
      const compInc = parseFloat(document.getElementById('set-comp-inc').value);
      const isoInc = parseFloat(document.getElementById('set-iso-inc').value);

      appState.settings.progressionMode = document.getElementById('set-prog-mode').value;
      appState.settings.calorieTarget = parseInt(document.getElementById('set-cal').value, 10) || 2000;
      appState.settings.proteinTarget = parseInt(document.getElementById('set-pro').value, 10) || 175;

      if (oldUnit === 'kg') {
        if (!isNaN(compInc) && compInc > 0) appState.settings.compoundIncrementKg = compInc;
        if (!isNaN(isoInc) && isoInc > 0) appState.settings.isolationIncrementKg = isoInc;
      } else {
        if (!isNaN(compInc) && compInc > 0) appState.settings.compoundIncrementLbs = compInc;
        if (!isNaN(isoInc) && isoInc > 0) appState.settings.isolationIncrementLbs = isoInc;
      }

      if (!isNaN(goalInput) && goalInput > 0) {
        appState.settings.goalWeight = oldUnit === 'kg' ? goalInput * LBS_PER_KG : goalInput;
      }
      appState.settings.unit = newUnit;

      saveState();
      closeModal();
      showToast('Settings saved!', 'success');
      renderCurrentTab();
    }

    function exportDataJSON() {
      try {
        const dataStr = JSON.stringify(appState, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `iron-macro-backup-${getLocalDateStr(new Date())}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('JSON backup exported!', 'success');
      } catch (err) {
        showToast('Export failed.', 'danger');
      }
    }

    function triggerImportJSON() {
      document.getElementById('json-import-input').click();
    }

    function handleImportFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || typeof parsed !== 'object' || (!parsed.workouts && !parsed.weights && !parsed.nutrition)) {
            throw new Error('Invalid backup structure');
          }
          openImportChoiceModal(parsed);
        } catch (err) {
          showToast('Invalid JSON backup file.', 'danger');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    /**
     * Ask user whether to MERGE imported JSON with existing logs or REPLACE all data.
     */
    function openImportChoiceModal(importedData) {
      const wkCount = Array.isArray(importedData.workouts) ? importedData.workouts.length : 0;
      const wtCount = importedData.weights ? Object.keys(importedData.weights).length : 0;
      const panel = document.getElementById('modal-panel');
      panel.innerHTML = `
        <div class="p-5 space-y-4">
          <h3 class="text-base font-black text-white">Restore JSON Backup</h3>
          <p class="text-xs text-slate-400 leading-relaxed">
            Found <strong class="text-white">${wkCount} workouts</strong> and <strong class="text-white">${wtCount} weight entries</strong> in this backup. How would you like to restore it?
          </p>
          <div class="space-y-2 pt-1">
            <button id="import-merge-btn" class="w-full min-h-[44px] rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black">
              Merge with My Current Data (Recommended)
            </button>
            <button id="import-replace-btn" class="w-full min-h-[44px] rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 text-xs font-extrabold">
              Replace All Current Data
            </button>
            <button onclick="closeModal()" class="w-full min-h-[40px] rounded-xl bg-slatebg-850 text-slate-400 text-xs font-bold">
              Cancel
            </button>
          </div>
        </div>
      `;

      document.getElementById('import-merge-btn').onclick = () => {
        mergeStates(appState, importedData);
        saveState();
        closeModal();
        showToast('Backup merged with your existing logs!', 'success');
        renderCurrentTab();
      };

      document.getElementById('import-replace-btn').onclick = () => {
        const defaults = createEmptyState();
        appState = {
          ...defaults,
          ...importedData,
          settings: { ...defaults.settings, ...(importedData.settings || {}) },
          templates: Array.isArray(importedData.templates) && importedData.templates.length > 0
            ? importedData.templates.map(t => ({ ...t, name: sanitizeSplitName(t.name) }))
            : getDefaultTemplates(),
          workouts: Array.isArray(importedData.workouts)
            ? importedData.workouts.map(w => ({ ...w, name: sanitizeSplitName(w.name) }))
            : []
        };
        saveState();
        closeModal();
        showToast('Backup restored!', 'success');
        renderCurrentTab();
      };

      openModal();
    }

    /**
     * Remove only pre-seeded sample entries while preserving every user-created log.
     */
    function confirmClearSampleDataKeepLogs() {
      openConfirmModal(
        'Clear Sample Data Only?',
        'Removes only the pre-seeded sample workouts, meals, and weights while keeping every workout, meal, and body weight you logged.',
        'Clear Sample Data',
        () => {
          appState.workouts = (appState.workouts || []).filter(w => !w.isSample);
          Object.keys(appState.nutrition || {}).forEach(d => {
            appState.nutrition[d] = (appState.nutrition[d] || []).filter(m => !m.isSample);
            if (appState.nutrition[d].length === 0) delete appState.nutrition[d];
          });
          Object.keys(appState.sampleWeightDates || {}).forEach(d => {
            if (appState.sampleWeightDates[d]) {
              delete appState.weights[d];
            }
          });
          appState.sampleWeightDates = {};
          saveState();
          showToast('Sample data cleared — your personal logs are safe!', 'success');
          renderCurrentTab();
        }
      );
    }

    function confirmResetAllData() {
      openConfirmModal(
        'Reset All Data?',
        'Clears ALL logged workouts, meals, and body weights while keeping your default Jeff Nippard PPLUL templates and Quick Foods.',
        'Reset Everything',
        () => {
          const prevSettings = { ...appState.settings };
          appState = createEmptyState();
          appState.settings = prevSettings;
          saveState();
          showToast('All logs cleared — ready for a fresh start.', 'info');
          renderCurrentTab();
        }
      );
    }

    function confirmReloadSampleData() {
      openConfirmModal(
        'Load 14-Day Sample Data?',
        'Replaces current logs with 2 full 5-workout PPLUL cycles (10 workouts), 14 days of meals, and weight logs.',
        'Load Sample',
        () => {
          appState = createSampleState();
          saveState();
          showToast('14-day sample dataset loaded!', 'success');
          renderCurrentTab();
        }
      );
    }

    /* =========================================================================
       11. INITIALIZATION
       ========================================================================= */
    document.getElementById('modal-root').addEventListener('click', (e) => {
      if (e.target.id === 'modal-root') closeModal();
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderCurrentTab();
    });
  </script>
</body>
</html>
